name: Payment Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.24"

jobs:
  build:
    name: Build Go Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build API binary
        run: go build -o bin/api ./cmd/api

      - name: Build Worker binary
        run: go build -o bin/worker ./cmd/worker


  docker:
    name: Build Docker Images
    needs: build   # run only if Go build succeeded
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t payment-api:ci -f cmd/api/Dockerfile .

      - name: Build Worker image
        run: docker build -t payment-worker:ci -f cmd/worker/Dockerfile .